
<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soleil Luxe | Sistema de gestión</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"><style>
/* Lucy — asistente virtual */
.lucy-launcher{position:fixed;right:24px;bottom:24px;width:62px;height:62px;border:0;border-radius:50%;
background:#c9a24d;color:#111;box-shadow:0 10px 30px #0003;cursor:pointer;font-weight:800;font-size:15px;z-index:1000}
.lucy-launcher:hover{transform:translateY(-2px);background:#e1c16e}
.lucy-panel{position:fixed;right:24px;bottom:96px;width:355px;max-width:calc(100vw - 30px);height:500px;background:#fff;
border:1px solid #ded9cc;border-radius:18px;box-shadow:0 18px 55px #0003;z-index:999;display:none;overflow:hidden}
.lucy-panel.open{display:flex;flex-direction:column}
.lucy-head{background:#111;color:#fff;padding:16px 18px;display:flex;align-items:center;justify-content:space-between}
.lucy-title{display:flex;align-items:center;gap:10px}.lucy-avatar{width:38px;height:38px;border-radius:50%;
background:#c9a24d;color:#111;display:grid;place-items:center;font-weight:900}.lucy-head small{display:block;color:#bbb;margin-top:2px}
.lucy-close{background:transparent;border:0;color:#fff;font-size:22px;cursor:pointer}
.lucy-messages{flex:1;padding:16px;overflow:auto;background:#f8f7f3}
.lucy-msg{max-width:86%;padding:10px 12px;border-radius:13px;margin-bottom:10px;font-size:13px;line-height:1.45}
.lucy-msg.bot{background:#fff;border:1px solid #e6e2d9;border-top-left-radius:4px}.lucy-msg.bot a{text-decoration:none}
.lucy-msg.user{background:#111;color:#fff;margin-left:auto;border-top-right-radius:4px}
.lucy-quick{display:flex;gap:7px;overflow-x:auto;padding:8px 12px;border-top:1px solid #eee;background:#fff}
.lucy-quick button{white-space:nowrap;border:1px solid #ddd4bd;background:#fff;border-radius:18px;padding:7px 10px;font-size:11px;cursor:pointer}
.lucy-input{display:flex;gap:7px;padding:10px;border-top:1px solid #eee;background:#fff}.lucy-input input{flex:1;min-width:0}
.lucy-input button{border:0;background:#c9a24d;border-radius:9px;padding:0 14px;font-weight:800;cursor:pointer}
@media(max-width:600px){.lucy-panel{right:12px;bottom:88px;width:calc(100vw - 24px);height:70vh}.lucy-launcher{right:14px;bottom:14px}}
</style></head>
<body><div class="app">
<aside class="sidebar"><div class="brand"><div class="mark">SL <span class="word">SOLEIL LUXE</span></div><small>Management</small></div>
<nav class="nav">
<a class="{{'active' if request.endpoint=='dashboard'}}" href="{{url_for('dashboard')}}">◈ <span>Dashboard</span></a>
<a class="{{'active' if request.endpoint=='inventory'}}" href="{{url_for('inventory')}}">▣ <span>Inventario</span></a>
<a class="{{'active' if request.endpoint=='sales'}}" href="{{url_for('sales')}}">◆ <span>Ventas</span></a>
<a class="{{'active' if request.endpoint=='customers'}}" href="{{url_for('customers')}}">♙ <span>Clientes</span></a>
<a class="{{'active' if request.endpoint=='finance'}}" href="{{url_for('finance')}}">◇ <span>Contabilidad</span></a>
<a class="{{'active' if request.endpoint=='reports'}}" href="{{url_for('reports')}}">▤ <span>Reportes</span></a>
<a class="{{'active' if request.endpoint=='collaborative'}}" href="{{url_for('collaborative')}}">◎ <span>Colaborativo</span></a>
</nav><div class="sidebar-tools"><a href="/cliente" target="_blank">↗ Portal cliente</a></div></aside>
<main class="main">
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,msg in messages %}<div class="flash {{category}}">{{msg}}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</main></div></body></html>
